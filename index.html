<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scholarship Recommendation System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Scholarship Recommendation System</h1>
    <form id="scholarshipForm">
      <label for="qualification">Highest Qualification:</label>
      <select id="qualification" required>
        <option value="">Select</option>
        <option value="10th">10th</option>
        <option value="12th">12th</option>
        <option value="UG">Undergraduate</option>
        <option value="PG">Postgraduate</option>
      </select>

      <label for="percentage">Highest Percentage:</label>
      <input type="number" id="percentage" required min="0" max="100">

      <label for="gender">Gender:</label>
      <select id="gender" required>
        <option value="">Select</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
      </select>

      <button type="submit">Submit</button>
    </form>

    <div id="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
